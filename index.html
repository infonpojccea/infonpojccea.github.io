  body {

  /* ===== 共通ヘッダー ===== */
  .site-header { width: 100%; }

    border-bottom: 2px solid #ddd;
    padding-bottom: 10px;
    margin-bottom: 30px;
  }

  .flex {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .flex img {
    width: 100%;
    height: auto;
  }

  .col-6 { width: 48%; }
