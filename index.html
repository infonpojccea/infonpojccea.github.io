<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>首页｜日中文化交流协会</title>
  <link rel="stylesheet" href="common.css">

  <style>
  /* ===== 基本 ===== */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    line-height: 1.8;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  /* ===== ヘッダー ===== */
  header {
    background: #fff;
    border-bottom: 1px solid #ddd;
  }

  .nav-bar {
    display: flex;
    align-items: center;
    padding: 15px 30px;
    min-height: 120px;
    position: relative;
    z-index: 1000;
  }

  .logo-area {
    display: flex;
    align-items: center;
  }

  .logo {
    height: 113px;
  }

  .org-name {
    margin-left: 12px;
    line-height: 1.2;
  }

  .org-top {
    font-size: 18px;
    font-weight: bold;
  }

  .org-bottom {
    font-size: 28px;
    font-weight: bold;
  }

  /* ===== メニュー ===== */
  nav {
    margin-left: auto;
    display: flex;
    gap: 18px;
  }

  nav a {
    text-decoration: none;
    color: #333;
    font-weight: bold;
    white-space: nowrap;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
  }

  nav a.active {
    color: #c00000;
    border-bottom: 2px solid #c00000;
  }

  /* ===== 見出し画像（100mm） ===== */
  .hero {
    height: 378px; /* 100mm */
    background: url("images/top1.jpg") center / cover no-repeat;
    display: flex;
    align-items: center;
    padding-left: 50px;
    color: #fff;
    font-size: 30px;
    font-weight: bold;
  }

  /* ===== セクション ===== */
  .section {
    max-width: 1000px;
    margin: 60px auto;
    padding: 0 20px;
  }

  .section h2 {
    text-align: center;
    margin-bottom: 40px;
  }

  .flex {
    display: flex;
    gap: 30px;
  }

  .col-6 {
    width: 50%;
  }

  .col-4 {
    width: 33.333%;
  }

  /* ===== フッター ===== */
  footer {
    background: #f5f5f5;
    padding: 30px;
    margin-top: 80px;
    font-size: 14px;
  }

  .footer-box {
    display: flex;
    align-items: center;
    position: relative;
  }

  .footer-box img {
    width: 70px;
  }

  .footer-links {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 60px;
  }

  .footer-links a {
    font-size: 16px;
    font-weight: bold;
    color: #333;
    text-decoration: none;
  }
    /* ===== 見出し画像（トップ専用）===== */
body.home .home-hero {

  align-items: center;
  padding-left: 50px;
  color: #fff;
  font-size: 32px;
  font-weight: bold;
}

  </style>
</head>
