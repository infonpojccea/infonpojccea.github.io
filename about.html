  <h2>成立宗旨</h2>
  <p>
    本协会以促进中日两国之间的文化交流与相互理解为宗旨，  
    通过文化、教育、研修及民间交流活动，  
    推动两国社会的友好合作与共生发展。
  </p>

  <h2>主要活动内容</h2>
  <ul>
    <li>中日文化交流活动的策划与实施</li>
    <li>教育、研修及访问交流项目</li>
    <li>讲座、研讨会及相关活动的举办</li>
    <li>促进中日民间友好交流的相关事业</li>
  </ul>
